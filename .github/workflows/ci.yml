# Actions are pinned by full commit SHA, not by tag. A tag is a mutable pointer
# in somebody else's repository: v5 moves whenever its owner moves it, and an
# action that is compromised or simply changed lands here on the next run with
# no diff in this file. A SHA is the artifact itself. The trailing comment is
# the human-readable version the SHA resolved to when it was written; Renovate
# updates both together (see renovate.json5).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod   # tracks go.mod; cannot drift from it
          cache: true
      - name: gofmt
        run: |
          unformatted="$(gofmt -l cmd internal)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      - name: go test
        run: go test -race ./...

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1  # pinned so a lint release cannot redden a green branch

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true
      # Reports only vulnerabilities on a call path this code actually reaches,
      # so an advisory in an unused corner of a dependency does not stop the
      # world. That is what makes it safe to fail the build on a finding.
      - name: govulncheck
        # Pinned, for the same reason the actions are. @latest also means the
        # scanner can change between two runs of the same commit, so a green
        # build turns red with nothing in this repository having moved -- which
        # is indistinguishable from a real finding until someone goes looking
        # for the diff that does not exist.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  identity:
    name: identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The gate checks every commit, so it needs every commit. With the
          # default shallow clone it would check one and report success.
          fetch-depth: 0
      - name: install gitleaks
        run: |
          version=8.24.0
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: identity, trailers and secrets over all history
        # The same file the pre-push hook runs, in its --all-history mode. The
        # hook is per-clone configuration and does not travel with a clone, so
        # this is the copy nobody can forget to install.
        run: ./.githooks/pre-push --all-history
      - name: prove the gate rejects and accepts what it claims
        run: ./.githooks/selftest.sh

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: gitleaks over full history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"
