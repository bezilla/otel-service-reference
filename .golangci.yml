version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - revive
    - gosec
    - unconvert
    - misspell

  settings:
    misspell:
      # This repository writes British English, in the prose and in the code
      # comments alike -- serialised, cancelled, labour, artefact. Naming the
      # locale keeps that consistent without anyone having to remember, which
      # is the same reason the sibling repositories name theirs. Setting it to
      # US here would not find bugs; it would rewrite the prose.
      locale: UK

    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: indent-error-flow
        - name: error-strings
        - name: error-return
        - name: unreachable-code
        - name: redefines-builtin-id

  exclusions:
    rules:
      # The tests stand up servers, drive them over loopback and read their own
      # fixtures; gosec's integer and network warnings are noise there.
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
