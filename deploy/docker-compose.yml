# The whole demonstration, in one file.
#
#   make up   ->  service + collector + prometheus + jaeger + grafana + traffic
#
# Grafana is the front door on :3000 and needs no login. The dashboard is
# provisioned from disk, so there is nothing to import.

name: otel-service-reference

services:
  service:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      OTEL_SERVICE_NAME: quote-api
      SERVICE_NAMESPACE: platform
      DEPLOYMENT_ENVIRONMENT: local
      OTEL_EXPORTER_OTLP_ENDPOINT: collector:4317
      API_ADDR: ":8080"
      PRICING_ADDR: ":8081"
      PRICING_URL: http://localhost:8081
    ports:
      - "${SERVICE_PORT:-8080}:8080"
    depends_on:
      collector:
        condition: service_started

  collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    depends_on:
      - prometheus
      - jaeger

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      # Metrics arrive by remote write from the collector, not by scraping.
      - --web.enable-remote-write-receiver
      # Without this Prometheus accepts the exemplars and stores none of them,
      # and the dashboard renders no dots with no error anywhere. It is the one
      # server-side flag the exemplar path actually requires.
      - --enable-feature=exemplar-storage
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_PORT:-16686}:16686"

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      # Land on the dashboard rather than an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/service-red.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
      - jaeger

  # Traffic, so the dashboard has a line to draw the moment it comes up. A demo
  # that requires the reader to generate their own load is a demo most readers
  # never see working.
  loadgen:
    image: curlimages/curl:8.11.1
    depends_on:
      service:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        i=1
        while true; do
          n=1
          while [ $$n -le 5 ]; do
            curl -s -o /dev/null "http://service:8080/api/quote?sku=SKU-$$i" || true
            i=$$(( (i % 9) + 1 ))
            n=$$(( n + 1 ))
          done
          sleep 1
        done
